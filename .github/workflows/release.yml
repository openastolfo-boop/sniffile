name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: build binary and portable tarball
        run: make build dist VERSION="${GITHUB_REF_NAME#v}"
      - name: install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
      - name: build deb and rpm
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cp bin/sniffile dist/sniffile
          VERSION=$VERSION GOARCH=amd64 nfpm package -f packaging/nfpm.yaml -p deb -t dist
          VERSION=$VERSION GOARCH=amd64 nfpm package -f packaging/nfpm.yaml -p rpm -t dist
          rm -f dist/sniffile
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm

  alpine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: build musl binary and apk
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e VERSION="${GITHUB_REF_NAME#v}" alpine:latest sh -c '
            set -e
            apk add --no-cache build-base go pkgconf gtk+3.0-dev webkit2gtk-4.1-dev
            export PATH="$PATH:$(go env GOPATH)/bin"
            go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
            make build VERSION="$VERSION"
            mkdir -p dist
            cp bin/sniffile dist/sniffile
            VERSION="$VERSION" GOARCH=amd64 nfpm package -f packaging/nfpm.yaml -p apk -t dist
            rm -f dist/sniffile
          '
      - uses: actions/upload-artifact@v4
        with:
          name: alpine
          path: dist/*.apk

  arch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: build pacman package
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e VERSION="${GITHUB_REF_NAME#v}" archlinux:latest sh -c '
            set -e
            pacman -Syu --noconfirm base-devel git go gtk3 webkit2gtk-4.1 zip
            useradd -m builder
            chown -R builder /src
            su builder -c "VERSION=$VERSION ./scripts/package-arch.sh"
          '
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: dist/*.pkg.tar.zst

  linux-legacy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev
      - run: make build TAGS=webkit2_40 dist VERSION="${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-legacy
          path: dist/*.tar.gz

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-nsis
            zip
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: ./scripts/build-windows.sh
        env:
          VERSION: ${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*setup.exe

  publish:
    needs: [linux, alpine, arch, linux-legacy, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
