name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: install desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: gofmt
        run: |
          out=$(gofmt -l $(find . -name '*.go' -not -path './.git/*' -not -path './third_party/*' -not -path './debian/*'))
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: make build
      - run: make dist
      - uses: actions/upload-artifact@v4
        with:
          name: sniffile-linux-amd64
          path: dist/*.tar.gz

  build-linux-legacy:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev
      - run: make build TAGS=webkit2_40
      - run: make dist
      - uses: actions/upload-artifact@v4
        with:
          name: sniffile-linux-amd64-legacy-webkit40
          path: dist/*.tar.gz

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-nsis
            zip
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: build desktop exe and installer
        run: ./scripts/build-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sniffile-windows-amd64
          path: |
            dist/*.zip
            dist/*setup.exe

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: sniffile-darwin-arm64
          path: bin/sniffile
